AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ghar Guardian - simulated household water digital twin backend

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
  LiveOrigin:
    Type: String
    Default: http://localhost:4173
    Description: Second allowed browser origin (the deployed dashboard, e.g. https://your-app.vercel.app)
  AlertEmail:
    Type: String
    Default: ""
    Description: Email address for owner alerts (leave blank to disable)

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ghar-guardian-owner-alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: GharGuardianDemo
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin, !Ref LiveOrigin]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  Fn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.lambda_handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          ENABLE_BEDROCK: 'false'
          ALERT_TOPIC_ARN: !Ref AlertTopic
          ALERT_MIN_INTERVAL_SECONDS: '300'
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - SNSPublishMessagePolicy: {TopicName: !GetAtt AlertTopic.TopicName}
      Events:
        Snapshot:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /snapshot, Method: GET}
        Event:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /event, Method: POST}

  FnLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Fn}
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
