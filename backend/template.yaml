AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ghar Guardian - simulated household water digital twin backend

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: GharGuardianDemo
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  Fn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          ENABLE_BEDROCK: 'false'
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
      Events:
        Snapshot:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /snapshot, Method: GET}
        Event:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /event, Method: POST}

  FnLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Fn}
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
